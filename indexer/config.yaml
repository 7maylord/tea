# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: tea-monad-testnet
description: TEA settlement events on Monad testnet
address_format: lowercase
contracts:
  - name: SettlementToken
    events:
      - event: "Transfer(address indexed from, address indexed to, uint256 value)"
  - name: TeaStream
    events:
      - event: "StreamCreated(uint256 indexed streamId, address indexed sender, address indexed recipient, address token, uint256 deposit, uint64 start, uint64 end)"
      - event: "StreamWithdrawn(uint256 indexed streamId, address indexed sender, address indexed recipient, address token, uint256 amount)"
      - event: "StreamCanceled(uint256 indexed streamId, address indexed sender, address indexed recipient, address token, uint256 recipientEntitlement, uint256 senderRefund)"
  - name: TeaClaimEscrow
    events:
      - event: "ClaimDeposited(bytes32 indexed claimId, address indexed payer, address indexed token, bytes32 identityCommitment, uint256 amount, uint64 expiry)"
      - event: "ClaimPaid(bytes32 indexed claimId, address indexed payer, address indexed recipient, address token, uint256 amount)"
      - event: "ClaimRefunded(bytes32 indexed claimId, address indexed payer, address indexed token, uint256 amount)"
  - name: TeaDateUnlock
    events:
      - event: "LockCreated(uint256 indexed lockId, address indexed sender, address indexed recipient, address token, uint256 amount, uint64 unlockAt)"
      - event: "LockWithdrawn(uint256 indexed lockId, address indexed sender, address indexed recipient, address token, uint256 amount)"
chains:
  - id: 10143
    rpc:
      url: https://testnet-rpc.monad.xyz
      for: sync
      initial_block_interval: 100
      interval_ceiling: 100
    start_block: 70763435
    contracts:
      - name: SettlementToken
        address: [0x82cE012544F85E33930C5272bdeAE76736A8F22b, 0xa9012a055bd4e0eDfF8Ce09f960291C09D5322dC]
      - name: TeaStream
        address: 0x38977cF2979F5040B5Cc660812e1faF802e15AdC
      - name: TeaClaimEscrow
        address: 0x2cb551cBA355339F3C6b43F931bBFDE60e6986fA
      - name: TeaDateUnlock
        address: 0x73A834d8de5fe088Cb183132358cd98E5fC3A9b9
