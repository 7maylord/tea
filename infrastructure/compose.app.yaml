name: tea-local-app

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tea
      POSTGRES_PASSWORD: tea_local_only
      POSTGRES_DB: tea
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tea -d tea"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  backend:
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://tea:tea_local_only@postgres:5432/tea
      REDIS_URL: redis://redis:6379
      APP_ORIGIN: http://127.0.0.1:3000,http://localhost:3000
      API_ORIGIN: http://127.0.0.1:3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.local
    env_file:
      - ../frontend/.env
    environment:
      NEXT_PUBLIC_API_ORIGIN: http://127.0.0.1:3001
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
  redis_data:
