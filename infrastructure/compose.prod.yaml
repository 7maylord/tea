name: tea-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tea}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tea} -d ${POSTGRES_DB:-tea}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../backend/.env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tea}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tea}
      REDIS_URL: redis://redis:6379
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_PRIVY_APP_ID: ${NEXT_PUBLIC_PRIVY_APP_ID:?set NEXT_PUBLIC_PRIVY_APP_ID}
        NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:?set NEXT_PUBLIC_API_ORIGIN}
        NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID:-10143}
        NEXT_PUBLIC_SETTLEMENT_TOKEN: ${NEXT_PUBLIC_SETTLEMENT_TOKEN:-0x82cE012544F85E33930C5272bdeAE76736A8F22b}
        NEXT_PUBLIC_CLAIM_ESCROW_ADDRESS: ${NEXT_PUBLIC_CLAIM_ESCROW_ADDRESS:-0x2cb551cBA355339F3C6b43F931bBFDE60e6986fA}
        NEXT_PUBLIC_TEA_STREAM_ADDRESS: ${NEXT_PUBLIC_TEA_STREAM_ADDRESS:-0x38977cF2979F5040B5Cc660812e1faF802e15AdC}
        NEXT_PUBLIC_TEA_DATE_UNLOCK_ADDRESS: ${NEXT_PUBLIC_TEA_DATE_UNLOCK_ADDRESS:-0x73A834d8de5fe088Cb183132358cd98E5fC3A9b9}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres_data:
  redis_data:
